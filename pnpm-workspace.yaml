# pnpm 11 bloquea los scripts de instalación de las dependencias hasta que se aprueban explícitamente;
# si alguno queda sin decidir, `pnpm install` falla en un clon limpio.
allowBuilds:
  # tsx (ejecuta scripts/migrate.ts) lo necesita.
  esbuild: true
  # Estos dos traen su binario precompilado como paquete opcional; su postinstall solo sirve de respaldo.
  '@parcel/watcher': false
  unrs-resolver: false
